<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medical Verification</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><main class="container py-4"><header class="d-flex justify-content-between mb-4"><h1 class="h3">Medical Verification</h1><a class="btn btn-outline-primary" href="/docs">Swagger</a></header>
<div class="card mb-3"><div class="card-body"><pre id="health">Loading health…</pre></div></div>
<div class="card"><div class="card-body"><label class="form-label">Original clinical text</label><textarea id="premise" class="form-control" rows="5"></textarea>
<label class="form-label mt-3">Simplified clinical text</label><textarea id="hypothesis" class="form-control" rows="5"></textarea>
<button id="run" class="btn btn-primary mt-3">Verify</button></div></div>
<div class="card mt-3"><div class="card-body"><h2 class="h5">Result</h2><pre id="result">No result yet.</pre></div></div>
</main><script src="/static/verification_dashboard.js"></script></body></html>
