<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IB Health Infrastructure</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/infrastructure_dashboard.css" rel="stylesheet">
</head>
<body class="bg-light" data-dashboard-version="{{ dashboard_version }}">
  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <div><h1 class="h3 mb-1">Production Infrastructure</h1><p class="text-secondary mb-0">PostgreSQL, Redis, Celery, migrations, caches, and durable jobs.</p></div>
      <div><a class="btn btn-outline-primary" href="/docs">Open Swagger</a> <button id="refresh" class="btn btn-primary">Refresh</button></div>
    </div>
    <div id="alert" class="alert d-none" role="alert"></div>
    <section class="row g-3 mb-4" id="components" aria-label="Infrastructure component health"></section>
    <section class="card shadow-sm mb-4">
      <div class="card-header fw-semibold">Operational Metrics</div>
      <div class="card-body"><div class="row g-3" id="metrics"></div></div>
    </section>
    <section class="card shadow-sm">
      <div class="card-header d-flex justify-content-between"><span class="fw-semibold">Recent Processing History</span><span id="migration" class="text-secondary"></span></div>
      <div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Job</th><th>Stage</th><th>Status</th><th>Progress</th><th>Updated</th></tr></thead><tbody id="jobs"><tr><td colspan="5" class="text-secondary">Loading...</td></tr></tbody></table></div>
    </section>
  </main>
  <script src="/static/infrastructure_dashboard.js"></script>
</body>
</html>
