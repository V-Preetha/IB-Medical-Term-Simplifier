<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IB Health Medical Simplification Console</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/simplification_dashboard.css" rel="stylesheet">
</head>
<body>
<main class="container py-4" data-schema-version="{{ schema_version }}">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
    <div><p class="text-uppercase text-primary fw-semibold mb-1">IB Health Engineering</p>
      <h1 class="h2 mb-0">Medical Report Simplification</h1></div>
    <nav class="d-flex gap-2"><a class="btn btn-outline-secondary" href="/engineering-demo">Engineering Demo</a><a class="btn btn-primary" href="/docs">Swagger</a></nav>
  </header>
  <div id="alert" class="alert d-none" role="alert"></div>
  <section class="card shadow-sm mb-4"><div class="card-body">
    <div class="d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Provider health</h2><button id="refresh-health" class="btn btn-sm btn-outline-primary">Refresh</button></div>
    <pre id="health-output" class="output mt-3">Loading...</pre>
  </div></section>
  <section class="card shadow-sm mb-4"><div class="card-body">
    <h2 class="h5">Normalized OCR text</h2>
    <p class="text-secondary">Use synthetic or de-identified content only. This engineering console sends text directly to the existing API.</p>
    <textarea id="report-text" class="form-control" rows="9" maxlength="200000" placeholder="HbA1c was 7.2%. Metformin was continued for type 2 diabetes."></textarea>
    <button id="run" class="btn btn-primary mt-3">Generate all three levels</button>
  </div></section>
  <section id="results" class="d-none">
    <div class="row g-3 mb-4">
      <div class="col-md-3"><div class="metric"><span>Latency</span><strong id="latency">-</strong></div></div>
      <div class="col-md-3"><div class="metric"><span>Model</span><strong id="model">-</strong></div></div>
      <div class="col-md-3"><div class="metric"><span>Revision</span><strong id="revision">-</strong></div></div>
      <div class="col-md-3"><div class="metric"><span>Prompt</span><strong id="prompt-version">-</strong></div></div>
    </div>
    <div class="row g-3" id="levels"></div>
    <div class="card shadow-sm mt-4"><div class="card-body"><h2 class="h5">Raw JSON</h2><pre id="raw-json" class="output"></pre></div></div>
  </section>
</main>
<script src="/static/simplification_dashboard.js"></script>
</body>
</html>
