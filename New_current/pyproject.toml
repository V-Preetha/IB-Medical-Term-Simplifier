[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ib-health-ocr-service"
version = "2.0.0"
description = "Phase 2 OCR service for IB Health Medical Term Simplifier"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "celery[redis]>=5.4,<6.0",
    "cryptography>=44.0,<46.0",
    "fastapi>=0.115,<1.0",
    "jinja2>=3.1,<4.0",
    "pillow>=10.0,<12.0",
    "pillow-heif>=0.18,<2.0",
    "pymupdf>=1.24,<2.0",
    "python-multipart>=0.0.9,<1.0",
    "psutil>=6.0,<8.0",
    "redis>=5.2,<7.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "torch>=2.2,<3.0",
    "transformers>=4.57,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
entity-linking = [
    "scispacy>=0.5,<0.6",
    "spacy>=3.7,<4.0",
]
clinical-ner = [
    "gliner>=0.2.27,<0.3",
    "torch>=2.2,<3.0",
    "transformers>=4.51.3,<5.14",
]
translation = [
    "indictranstoolkit>=1.1,<2.0",
]
dev = [
    "aiosqlite>=0.20,<1.0",
    "fakeredis>=2.26,<3.0",
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
